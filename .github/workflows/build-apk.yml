name: Build EROM BOX APK

on:
  workflow_dispatch:
  push:
    paths:
      - "erom-box/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilar EROM BOX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extrair projeto Android
        shell: bash
        run: |
          set -euo pipefail
          ZIP="erom-box/EromBox-Android-Studio.zip"
          test -s "$ZIP" || { echo "::error::Arquivo do projeto Android não encontrado: $ZIP"; exit 1; }
          mkdir -p android-project
          unzip -q "$ZIP" -d android-project
          echo "Conteúdo extraído:"
          find android-project -maxdepth 4 -type f | sort | head -200

      - name: Localizar projeto Gradle
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=""
          if [ -f android-project/gradlew ]; then ROOT="android-project"; fi
          if [ -z "$ROOT" ]; then
            WRAPPER=$(find android-project -type f -name gradlew -print -quit)
            if [ -n "$WRAPPER" ]; then ROOT="$(dirname "$WRAPPER")"; fi
          fi
          if [ -z "$ROOT" ]; then
            BUILD=$(find android-project -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)
            if [ -n "$BUILD" ]; then ROOT="$(dirname "$BUILD")"; fi
          fi
          if [ -z "$ROOT" ]; then
            echo "::error::O ZIP não contém gradlew nem build.gradle/build.gradle.kts. É necessário um projeto Android Studio completo."
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Projeto detectado em: $ROOT"

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK/sdmanager não encontrado no runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate.outputs.root }}"
          cd "$ROOT"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            echo "Sem Gradle Wrapper; usando Gradle instalado."
            curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Encontrar e validar APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "${{ steps.locate.outputs.root }}" -type f -path "*/build/outputs/apk/*/*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::A compilação terminou sem gerar APK."
            exit 1
          fi
          mkdir -p output
          cp "$APK" output/EROM-BOX.apk
          ls -lh output/EROM-BOX.apk

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: EROM-BOX-APK
          path: output/EROM-BOX.apk
          if-no-files-found: error
          retention-days: 14

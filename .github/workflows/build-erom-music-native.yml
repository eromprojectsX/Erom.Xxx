name: Build Erom Música Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - "erom-music-native/**"
      - ".github/workflows/build-erom-music-native.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilar Erom Música nativo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gerar projeto Android nativo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-build/app/src/main/java/br/com/erommusic/nativeapp native-build/app/src/main/res/values
          cp erom-music-native/MainActivity.kt native-build/app/src/main/java/br/com/erommusic/nativeapp/MainActivity.kt
          cat > native-build/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "EromMusicNative"
          include(":app")
          EOF
          cat > native-build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
              id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21' apply false
          }
          EOF
          cat > native-build/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > native-build/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'org.jetbrains.kotlin.plugin.compose'
          }
          android {
              namespace 'br.com.erommusic.nativeapp'
              compileSdk 35
              defaultConfig {
                  applicationId 'br.com.erommusic.nativeapp'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
              buildFeatures { compose true }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.12.01')
              implementation 'androidx.activity:activity-compose:1.10.0'
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-tooling-preview'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'androidx.navigation:navigation-compose:2.8.5'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
          }
          EOF
          cat > native-build/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Erom Música</string></resources>
          EOF
          cat > native-build/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="@string/app_name" android:usesCleartextTraffic="false" android:allowBackup="true">
              <activity android:name="br.com.erommusic.nativeapp.MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

      - name: Instalar componentes Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "::error::Android SDK/sdmanager não encontrado"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK Android nativo
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace -p native-build assembleDebug
          APK=native-build/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "::error::APK nativo não foi gerado"; exit 1; }
          unzip -l "$APK" | grep -q 'classes.dex'
          mkdir -p output
          cp "$APK" output/Erom-Musica-NATIVO.apk
          sha256sum output/Erom-Musica-NATIVO.apk
          ls -lh output/Erom-Musica-NATIVO.apk

      - name: Disponibilizar APK nativo
        uses: actions/upload-artifact@v4
        with:
          name: Erom-Musica-NATIVO-APK
          path: output/Erom-Musica-NATIVO.apk
          if-no-files-found: error
          retention-days: 14
